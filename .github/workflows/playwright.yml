name: EventHub Automation Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: playwright-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run EventHub Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Restore Allure History
        uses: actions/cache/restore@v5
        with:
          path: test-output/reports/allure/history
          key: allure-history-${{ github.run_id }}
          restore-keys: |
            allure-history-

      - name: Run EventHub Tests
        run: npm run test:regression
        env:
          CI: true

      - name: Generate Allure Report
        if: ${{ !cancelled() }}
        run: npm run report

      - name: Save Allure History
        if: ${{ !cancelled() }}
        uses: actions/cache/save@v5
        with:
          path: test-output/reports/allure/history
          key: allure-history-${{ github.run_id }}

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: test-output/reports/playwright-report/
          retention-days: 30

      - name: Upload Allure Report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: allure-report
          path: test-output/reports/allure-report/
          retention-days: 30
